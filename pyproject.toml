[project]
name = "slitherbot"
version = "0.1.0"
description = "Modular slither.io automation bot"
readme = "README.md"
authors = [{name = "Slither Bot"}]
requires-python = ">=3.9"
dependencies = [
    "websockets>=11.0",
    "pydantic>=1.10",
    "numpy>=1.24",
    "feedparser>=6.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dateutil>=2.8",
    "vaderSentiment>=3.3",
    "pytz>=2023.3",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-httplib2>=0.1"
]

[project.scripts]
slitherbot = "slitherbot.cli:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["slitherbot", "automation*"]
